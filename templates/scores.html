<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Leaderboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #e5e7eb;
        --card-bg: #f3f4f6;
        --text-dark: #111827;
        --text-muted: #4b5563;
        --accent-blue: #1E3A8A;
        --accent-blue-hover: #162b66;
        --accent-gold: #d97706;
        --row-bg: #ffffff;
        --row-hover: #f8fafc;
        --border-color: #d1d5db;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 16px 16px;
        color: var(--text-dark);
        margin: 0;
        padding: 30px 15px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .leaderboard-card {
        width: 100%;
        max-width: 480px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 28px 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .header-title {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 4px 0;
        color: var(--text-dark);
      }

      .tagline {
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .live-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-secondary);
        letter-spacing: 1px;
        margin-bottom: 24px;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        background: #ef4444; /* Changed to red */
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); /* Red glow effect */
        animation: blink 1.2s infinite ease-in-out;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Top 3 Podium Section */
      .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 28px;
        padding: 10px 0;
      }

      .podium-player {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100px;
      }

      .podium-rank {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .podium-avatar-wrapper {
        position: relative;
        margin-bottom: 8px;
      }

      .crown-icon {
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
      }

      .podium-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid var(--accent-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .podium-player.rank-1 .podium-avatar {
        width: 74px;
        height: 74px;
        border-color: var(--accent-gold);
        box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
        font-size: 32px;
      }

      .podium-player.rank-1 .podium-rank {
        color: var(--accent-gold);
        font-size: 16px;
      }

      .podium-name {
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        color: var(--text-dark);
      }

      .podium-score {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent-blue);
      }

      /* Search Controls */
      .search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .search-box input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: #ffffff;
        color: var(--text-dark);
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }

      .search-box input:focus {
        border-color: var(--accent-blue);
      }

      .search-box button {
        padding: 10px 16px;
        border-radius: 10px;
        border: none;
        background: var(--accent-blue);
        color: #ffffff;
        font-family: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .search-box button:hover {
        background: var(--accent-blue-hover);
      }

      .search-box button.btn-reset {
        background: #e5e7eb;
        color: var(--text-dark);
        border: 1px solid var(--border-color);
      }

      .search-box button.btn-reset:hover {
        background: #d1d5db;
      }

      /* Standard List Rows */
      .leaderboard-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 380px;
        overflow-y: auto;
      }

      .row {
        display: flex;
        align-items: center;
        background: var(--row-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 10px 16px;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .row:hover {
        background: var(--row-hover);
        transform: translateY(-1px);
      }

      .rank-num {
        font-size: 15px;
        font-weight: 700;
        width: 28px;
        color: var(--text-muted);
      }

      .avatar-small {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #f3f4f6;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        margin-right: 14px;
      }

      .user-info {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .user-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dark);
      }

      .student-id {
        font-size: 11px;
        color: var(--text-muted);
      }

      .row-score {
        font-size: 16px;
        font-weight: 700;
        color: var(--accent-blue);
      }
    </style>
  </head>

  <body>
    <div class="leaderboard-card">
      <h1 class="header-title">AAKRITHI '26</h1>
      <div class="tagline">Evoke • Evolve • Evince</div>
      <div class="live-status">
        <span class="live-dot"></span> LIVE LEADERBOARD
      </div>

      <div class="podium-container" id="podiumSection"></div>

      <div class="search-box">
        <input
          type="text"
          id="searchId"
          placeholder="Search Student ID..."
          onkeyup="if (event.key === 'Enter') searchStudent();"
        />
        <button onclick="searchStudent()">Search</button>
        <button class="btn-reset" onclick="showAll()">Reset</button>
      </div>

      <div class="leaderboard-list" id="scoreTable">
        {% for student in students %}
        <div class="row">
          <div class="rank-num">{{ loop.index }}</div>
          <div class="avatar-small">👤</div>
          <div class="user-info">
            <span class="user-name">{{ student.name }}</span>
            <span class="student-id">ID: {{ student.student_id }}</span>
          </div>
          <div class="row-score">{{ student.score }}</div>
        </div>
        {% endfor %}
      </div>
    </div>

    <script>
      let allStudents = [];

      function renderPodium(topThree) {
        const podiumContainer = document.getElementById("podiumSection");
        if (!topThree || topThree.length === 0) {
          podiumContainer.innerHTML = "";
          return;
        }

        const first = topThree[0] || { name: "-", score: "-", student_id: "-" };
        const second = topThree[1] || {
          name: "-",
          score: "-",
          student_id: "-",
        };
        const third = topThree[2] || { name: "-", score: "-", student_id: "-" };

        podiumContainer.innerHTML = `
        <div class="podium-player rank-2">
            <div class="podium-rank">2</div>
            <div class="podium-avatar-wrapper">
                <div class="podium-avatar">👤</div>
            </div>
            <div class="podium-name">${second.name}</div>
            <div class="podium-score">${second.score !== "-" ? second.score.toLocaleString() : "-"}</div>
        </div>

        <div class="podium-player rank-1">
            <div class="podium-rank">1</div>
            <div class="podium-avatar-wrapper">
                <span class="crown-icon">👑</span>
                <div class="podium-avatar">👤</div>
            </div>
            <div class="podium-name">${first.name}</div>
            <div class="podium-score">${first.score !== "-" ? first.score.toLocaleString() : "-"}</div>
        </div>

        <div class="podium-player rank-3">
            <div class="podium-rank">3</div>
            <div class="podium-avatar-wrapper">
                <div class="podium-avatar">👤</div>
            </div>
            <div class="podium-name">${third.name}</div>
            <div class="podium-score">${third.score !== "-" ? third.score.toLocaleString() : "-"}</div>
        </div>
    `;
      }

      function renderTable(studentsToRender) {
        const listContainer = document.getElementById("scoreTable");

        if (studentsToRender.length === 0) {
          listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">No students found</div>`;
          return;
        }

        listContainer.innerHTML = studentsToRender
          .map((student) => {
            const rank =
              allStudents.findIndex(
                (s) => s.student_id === student.student_id,
              ) + 1;

            return `
            <div class="row">
                <div class="rank-num">${rank}</div>
                <div class="avatar-small">👤</div>
                <div class="user-info">
                    <span class="user-name">${student.name}</span>
                    <span class="student-id">ID: ${student.student_id}</span>
                </div>
                <div class="row-score">${student.score.toLocaleString()}</div>
            </div>
        `;
          })
          .join("");
      }

      async function updateScores() {
        try {
          const response = await fetch("/api/scores");
          allStudents = await response.json();

          allStudents.sort((a, b) => b.score - a.score);

          renderPodium(allStudents.slice(0, 3));

          const searchId = document
            .getElementById("searchId")
            .value.trim()
            .toUpperCase();

          if (searchId === "") {
            renderTable(allStudents);
          } else {
            const filtered = allStudents.filter((student) =>
              student.student_id.toUpperCase().includes(searchId),
            );
            renderTable(filtered);
          }
        } catch (error) {
          console.error("Unable to fetch scores:", error);
        }
      }

      function searchStudent() {
        const searchId = document
          .getElementById("searchId")
          .value.trim()
          .toUpperCase();
        if (!searchId) {
          renderTable(allStudents);
          return;
        }
        const filtered = allStudents.filter((student) =>
          student.student_id.toUpperCase().includes(searchId),
        );
        renderTable(filtered);
      }

      function showAll() {
        document.getElementById("searchId").value = "";
        renderTable(allStudents);
      }

      updateScores();
      setInterval(updateScores, 2000);
    </script>
  </body>
</html>
