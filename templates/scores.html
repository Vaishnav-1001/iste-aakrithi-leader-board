<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .live {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* Blinking red dot */
        .live-dot {
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        /* Blink animation */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        .score {
            font-weight: bold;
            font-size: 20px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .search-box button {
            padding: 10px 18px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🏆 Live Student Leaderboard</h1>

    <div class="search-box">
        <input type="text" id="searchId" placeholder="Enter Student ID" onkeyup="if(event.key === 'Enter') searchStudent()">
        <button onclick="searchStudent()">Search</button>
        <button onclick="showAll()">Show All</button>
    </div>

    <p class="live">
        <span class="live-dot"></span>
        LIVE
    </p>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Student ID</th>
                <th>Name</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="scoreTable">
            {% for student in students %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ student.student_id }}</td>
                <td>{{ student.name }}</td>
                <td class="score">{{ student.score }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
let allStudents = [];

function renderTable(studentsToRender) {
    const tableBody = document.getElementById("scoreTable");

    if (studentsToRender.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4">No students found</td></tr>`;
        return;
    }

    tableBody.innerHTML = studentsToRender.map((student, index) => {
        // Find original overall rank based on sorted order
        const rank = allStudents.findIndex(s => s.student_id === student.student_id) + 1;
        return `
            <tr>
                <td>${rank}</td>
                <td>${student.student_id}</td>
                <td>${student.name}</td>
                <td class="score">${student.score}</td>
            </tr>
        `;
    }).join("");
}

async function updateScores() {
    try {
        const response = await fetch("/api/scores");
        allStudents = await response.json();

        // Sort by score (Highest first)
        allStudents.sort((a, b) => b.score - a.score);

        const searchId = document.getElementById("searchId").value.trim().toUpperCase();

        if (searchId === "") {
            renderTable(allStudents);
        } else {
            const filtered = allStudents.filter(student =>
                student.student_id.toUpperCase().includes(searchId)
            );
            renderTable(filtered);
        }
    } catch (error) {
        console.error("Unable to fetch scores:", error);
    }
}

function searchStudent() {
    const searchId = document.getElementById("searchId").value.trim().toUpperCase();
    if (!searchId) {
        renderTable(allStudents);
        return;
    }
    const filtered = allStudents.filter(student =>
        student.student_id.toUpperCase().includes(searchId)
    );
    renderTable(filtered);
}

function showAll() {
    document.getElementById("searchId").value = "";
    renderTable(allStudents);
}

// Initial fetch & live interval polling every 2 seconds
updateScores();
setInterval(updateScores, 2000);
</script>

</body>
</html>
